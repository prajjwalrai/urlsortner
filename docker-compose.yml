version: '3.8'

services:
  mongo:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - quicklink_net

  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - quicklink_net

  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/quicklink
      - REDIS_URI=redis://redis:6379
      - JWT_SECRET=supersecretjwtkey
    depends_on:
      - mongo
      - redis
    networks:
      - quicklink_net

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - quicklink_net

volumes:
  mongo_data:
  redis_data:

networks:
  quicklink_net:
    driver: bridge
